<!-- 단일 페이지 애플리케이션(SPA) 마크업 -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이름 뭘로 하지</title>
    <link rel="stylesheet" href="./style/main.css">
    <link rel="icon" href="./favicon.png" type="image/png">
</head>

<body>
    <div id="title-screen" class="screen">
        <h1>이름 아직 못정함</h1>
        <div class="notice">
            데이터가 브라우저에서 저장되기 때문에 서버 저장 그런건 없읍니다
        </div>
        <div class="menu-buttons">
            <button id="stage-btn">출전하기</button>
            <button id="upgrade-btn">강화실</button>
            <button id="dictionary-btn">도감</button>
            <button id="setting-btn">설정</button>
        </div>
    </div>

    <div id="modeSelector-screen" class="screen hidden">
        <h2>출전 모드 선택</h2>
        <div class="mode-buttons">
            <button id="solo-mode-btn">솔로 스테이지</button>
            <button id="multi-mode-btn">멀티 대전 모드</button>
        </div>
        <button id="mode-back-btn" class="back-btn">뒤로가기</button>
    </div>

    <div id="stageSelector-screen" class="screen hidden">
        <h2>스테이지 선택</h2>
        <div id="stage-list">
        </div>
        <button id="stage-back-btn" class="back-btn">뒤로가기</button>
    </div>

    <div id="upgrade-screen" class="screen hidden">
        <h2>강화실</h2>
        <div id="enhance-group-list" style="display: flex; gap: 10px; margin-bottom: 20px;"></div>

        <div class="enhance-container">
            <div id="enhance-card">
                <img id="display" src="" alt="Enhance Target">
                <h3 id="enhance-name" style="margin: 10px 0; color: #f1c40f;">-</h3>
                <p>현재 등급: <span id="current-level">0</span>강</p>
                <p id="enhance-percentage" style="margin-top: 5px; font-size: 14px; color: #bdc3c7;">확률: 0%</p>
                <p id="drop-percentage" style="margin-top: 5px; font-size: 14px; color: #cc2e2e;">하락 확률: 0%</p>
            </div>
            <div id="upgrade-btn-list"></div>
        </div>

        <div id="storage-box"
            style="margin-top: 30px; border-top: 2px dashed #444; padding-top: 20px; text-align: left; width: 100%; max-width: 500px; margin-left: auto; margin-right: auto;">
            <h3 style="color: #ecf0f1; margin-bottom: 10px;">📦 보관실 (창고)</h3>
            <div id="storage-list"
                style="display: flex; gap: 10px; flex-wrap: wrap; min-height: 80px; background: #2c3e50; padding: 15px; border-radius: 8px;">
            </div>
        </div>

        <button id="back-btn" class="back-btn" style="margin-top: 20px;">뒤로가기</button>
    </div>

    <div id="dictionary-screen" class="screen hidden">
        <h2>도감</h2>
        <button id="dictionary-back-btn" class="back-btn" style="margin-top: 20px;">뒤로가기</button>
    </div>

    <div id="stage-screen" class="screen hidden">
        <div id="battle-field-container">
            <div id="field">
                <div id="enemyBase" class="base">
                    <span id="enemyBaseHp"></span>
                </div>
                <div id="playerBase" class="base">
                    <span id="playerBaseHp"></span>
                </div>
            </div>
        </div>

        <div id="forge-panel">
            <div class="forge-header">강화실 & 보관함</div>

            <div id="forge-group-list"></div>
            <div id="forge-display-area">
                <img id="forge-display" src="" alt="비었음">
                <div id="forge-name">비었음</div>
                <div id="forge-level">-</div>
            </div>
            <div id="forge-btn-container"></div>

            <div class="storage-title">보관된 개체 (클릭 시 소환)</div>
            <div id="forge-storage-list"></div>
        </div>
    </div>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>게임 설정</h3>
            <button id="close-settings">닫기</button>
        </div>
    </div>

    <div id="network-loading" class="modal hidden">
        <div class="modal-content text-center">
            <div class="spinner"></div>
            <p id="loading-text">멀티플레이 서버에 연결 중입니다...<br>(최대 1분이 소요될 수 있습니다)</p>
        </div>
    </div>

    <script type="module" src="./scripts/main.js"></script>
</body>

</html>
